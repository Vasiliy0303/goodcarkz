<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoodCar Platform — Вход</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F0F2F5;min-height:100vh;display:flex;align-items:center;justify-content:center}

.bg{position:fixed;inset:0;background:linear-gradient(135deg,#1A1A2E 0%,#2C0A0A 50%,#1A1A2E 100%);z-index:0}
.bg-pattern{position:fixed;inset:0;z-index:1;opacity:.05;background-image:repeating-linear-gradient(45deg,#fff 0,#fff 1px,transparent 0,transparent 50%);background-size:20px 20px}

.wrap{position:relative;z-index:10;width:100%;max-width:420px;padding:20px}

/* Card */
.card{background:#fff;border-radius:20px;padding:40px 36px;box-shadow:0 24px 80px rgba(0,0,0,.3)}

/* Logo */
.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center}
.logo-icon{width:48px;height:48px;background:#C0392B;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 16px rgba(192,57,43,.4)}
.logo-text{text-align:left}
.logo-name{font-size:20px;font-weight:800;color:#1A1A2E;line-height:1.1}
.logo-sub{font-size:10px;font-weight:700;color:#C0392B;letter-spacing:2px;text-transform:uppercase}

/* Title */
.title{font-size:22px;font-weight:800;color:#1A1A2E;margin-bottom:6px;text-align:center}
.subtitle{font-size:13px;color:#AAA;text-align:center;margin-bottom:28px}

/* Form */
.form-group{margin-bottom:16px}
.form-label{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px}
.form-input{width:100%;background:#F8F8F8;border:2px solid #F0F0F0;border-radius:10px;padding:12px 16px;font-size:14px;font-family:inherit;color:#1A1A2E;transition:all .15s;outline:none}
.form-input:focus{border-color:#C0392B;background:#fff;box-shadow:0 0 0 4px rgba(192,57,43,.08)}
.form-input::placeholder{color:#CCC}

/* Role selector */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.role-btn{padding:10px 8px;border:2px solid #F0F0F0;border-radius:10px;background:#F8F8F8;cursor:pointer;transition:all .15s;text-align:center;font-family:inherit}
.role-btn:hover{border-color:#C0392B;background:#FFF5F5}
.role-btn.active{border-color:#C0392B;background:#FFF0F0}
.role-icon{font-size:18px;display:block;margin-bottom:4px}
.role-name{font-size:11px;font-weight:600;color:#555}
.role-btn.active .role-name{color:#C0392B}

/* Submit */
.btn-submit{width:100%;background:#C0392B;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px}
.btn-submit:hover{background:#A93226;transform:translateY(-1px);box-shadow:0 6px 20px rgba(192,57,43,.35)}
.btn-submit:active{transform:translateY(0)}
.btn-submit:disabled{background:#DDD;cursor:not-allowed;transform:none;box-shadow:none}

/* Error */
.error-box{background:#FFF0F0;border:1px solid #F5C6C6;border-radius:8px;padding:10px 14px;font-size:13px;color:#C0392B;margin-bottom:14px;display:none;align-items:center;gap:8px}
.error-box.show{display:flex}

/* Loading */
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Divider */
.divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:#DDD;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#EEE}

/* Demo accounts */
.demo-grid{display:grid;gap:6px}
.demo-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#FAFAFA;border:1px solid #EEE;border-radius:8px;cursor:pointer;transition:all .12s}
.demo-item:hover{background:#FFF5F5;border-color:#F5C6C6}
.demo-left{display:flex;align-items:center;gap:8px}
.demo-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.demo-name{font-size:12px;font-weight:600;color:#1A1A2E}
.demo-role{font-size:10px;color:#AAA}
.demo-arrow{font-size:12px;color:#C0392B}

/* Footer */
.footer{text-align:center;margin-top:24px;font-size:12px;color:#AAA}
.footer span{color:#C0392B;font-weight:600}
</style>
</head>

<script>
// Проверка сотрудников идёт через /api/staff. Выдуманных учёток больше нет:
// первый зарегистрировавшийся становится руководителем, остальных он подтверждает.

function showError(msg, box = 'error') {
  const b = document.getElementById(box === 'reg' ? 'reg-error' : 'error-box');
  document.getElementById(box === 'reg' ? 'reg-error-text' : 'error-text').textContent = msg;
  b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 5000);
}

function showOk(msg) {
  const b = document.getElementById('reg-ok');
  document.getElementById('reg-ok-text').textContent = msg;
  b.classList.add('show');
}

function setLoading(on, which = 'login') {
  const btn = document.getElementById(which === 'reg' ? 'reg-btn' : 'login-btn');
  const txt = document.getElementById(which === 'reg' ? 'reg-btn-text' : 'btn-text');
  if (!btn) return;
  btn.disabled = on;
  if (on) txt.innerHTML = '<div class="spinner"></div> Отправляем…';
  else txt.textContent = which === 'reg' ? 'Отправить заявку' : 'Войти в систему';
}

function showTab(tab) {
  document.getElementById('card-login').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('card-reg').style.display   = tab === 'reg'   ? '' : 'none';
  if (tab === 'reg') loadPositions();
}

function saveSession(user) {
  localStorage.setItem('gc:user', JSON.stringify({
    ...user, loginAt: new Date().toISOString(),
  }));
}

// ── Должности подтягиваются из базы ───────────────────────────────────────
let POSITIONS = [];
async function loadPositions() {
  const sel = document.getElementById('r-position');
  if (POSITIONS.length) return;
  try {
    const res = await fetch('/api/staff?positions=1');
    const data = await res.json();
    POSITIONS = data.data || [];
    sel.innerHTML = '<option value="">— выберите должность —</option>' +
      POSITIONS.map(p => `<option value="${p.code}">${p.title}</option>`).join('');
    sel.onchange = () => {
      const p = POSITIONS.find(x => x.code === sel.value);
      document.getElementById('r-hint').textContent = p ? p.hint : '';
    };
  } catch(e) {
    sel.innerHTML = '<option value="">Не удалось загрузить список</option>';
  }
}

// ── Регистрация ───────────────────────────────────────────────────────────
async function doRegister() {
  const body = {
    action:   'register',
    name:     document.getElementById('r-name').value.trim(),
    position: document.getElementById('r-position').value,
    city:     document.getElementById('r-city').value || null,
    phone:    document.getElementById('r-phone').value.trim(),
    email:    document.getElementById('r-email').value.trim(),
    password: document.getElementById('r-password').value,
  };
  if (!body.name || !body.email || !body.password || !body.position) {
    showError('Заполните имя, должность, email и пароль', 'reg');
    return;
  }
  if (body.password.length < 6) {
    showError('Пароль должен быть не короче 6 символов', 'reg');
    return;
  }

  setLoading(true, 'reg');
  try {
    const res = await fetch('/api/staff', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    setLoading(false, 'reg');

    if (!res.ok) { showError(data.error || 'Не удалось зарегистрироваться', 'reg'); return; }

    if (data.first) {
      // Самый первый сотрудник — руководитель, входит сразу
      showOk(data.message);
      setTimeout(() => {
        document.getElementById('email').value = body.email;
        document.getElementById('password').value = body.password;
        showTab('login');
        doLogin();
      }, 1200);
    } else {
      showOk(data.message);
      document.getElementById('reg-btn').disabled = true;
      document.getElementById('reg-btn-text').textContent = 'Заявка отправлена';
    }
  } catch(e) {
    setLoading(false, 'reg');
    showError('Ошибка соединения с сервером', 'reg');
  }
}

// ── Вход ──────────────────────────────────────────────────────────────────
async function doLogin() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) { showError('Введите email и пароль'); return; }
  setLoading(true);

  try {
    const res = await fetch('/api/staff', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', email, password }),
    });
    const data = await res.json();
    setLoading(false);

    if (!res.ok || !data.data) {
      showError(data.error || 'Неверный email или пароль');
      return;
    }
    const u = data.data;
    // id обязателен: по нему лид закрепляется за сотрудником
    saveSession({
      id: u.id, email: u.email, name: u.name,
      role: u.role,                    // admin | manager | viewer — права
      position: u.position,            // подпись в интерфейсе
      city: u.city, avatar: u.avatar, color: u.color,
    });
    window.location.href = '/crm.html';
  } catch(e) {
    setLoading(false);
    showError('Ошибка соединения с сервером');
  }
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const onReg = document.getElementById('card-reg').style.display !== 'none';
  onReg ? doRegister() : doLogin();
});

// Сессия живёт 8 часов
const existing = localStorage.getItem('gc:user');
if (existing) {
  try {
    const u = JSON.parse(existing);
    if ((Date.now() - new Date(u.loginAt)) / 3600000 < 8 && u.id) {
      window.location.href = '/crm.html';
    }
  } catch(e) {}
}
</script>
</body>
</html>
